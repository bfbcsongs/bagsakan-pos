<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RPLMC Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.12);
    --input-bg: #0f172a;
    --locked-bg: #162032;
    --red-amount: #f87171;
    --green-btn: #22c55e;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 4px;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    gap: 8px;
  }

  .container {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  .top-bar h1 {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
  }

  .btn-group {
    display: flex;
    gap: 4px;
  }

  button {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-lock {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .btn-lock.unlocked {
    background: rgba(250, 204, 21, 0.15);
    color: #facc15;
    border: 1px solid rgba(250, 204, 21, 0.4);
  }

  .btn-clear {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    background: #162032;
    color: var(--muted);
    font-size: 0.68rem;
    text-transform: uppercase;
    padding: 6px 2px;
    border-bottom: 1px solid var(--border);
  }

  th:nth-child(1), td:nth-child(1) { width: 16%; text-align: center; }
  th:nth-child(2), td:nth-child(2) { width: 26%; text-align: center; }
  th:nth-child(3), td:nth-child(3) { width: 28%; text-align: center; }
  th:nth-child(4), td:nth-child(4) { width: 30%; text-align: right; padding-right: 8px; }

  /* Ultra-compact rows para laging kita kahit may keyboard */
  tbody td {
    padding: 4px 2px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .code-badge {
    display: inline-block;
    font-weight: 800;
    font-size: 0.85rem;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 3px 8px;
    border-radius: 4px;
  }

  input[type="number"] {
    width: 95%;
    padding: 5px 2px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    outline: none;
  }

  input[type="number"]:focus {
    border-color: var(--accent);
  }

  .mult-input:disabled {
    background: var(--locked-bg);
    border-color: transparent;
    color: #94a3b8;
  }

  .mult-input:not(:disabled) {
    border-color: rgba(250, 204, 21, 0.5);
    background: #172033;
    color: #fef08a;
  }

  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }

  .amount-cell {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--red-amount);
  }

  .action-bar {
    padding: 6px 10px;
    background: #162032;
    border-bottom: 1px solid var(--border);
  }

  .btn-enter {
    width: 100%;
    padding: 6px;
    background: var(--green-btn);
    color: #052e16;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
  }

  .summary-section {
    background: #0b1324;
    border-bottom: 1px solid var(--border);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px dashed var(--border);
  }

  .summary-row:last-child {
    border-bottom: none;
  }

  .summary-label {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--muted);
  }

  .summary-value {
    font-size: 0.95rem;
    font-weight: 800;
  }

  #total-amount-disp {
    color: var(--red-amount);
    font-size: 1.05rem;
  }

  .payment-input {
    width: 120px;
    padding: 4px 6px;
    background: var(--input-bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: #4ade80;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: right;
    outline: none;
  }

  #diff-disp {
    font-size: 1rem;
  }

  .name-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: #162032;
  }

  .name-bar label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .name-bar input[type="text"] {
    width: 100%;
    padding: 5px 8px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 600;
    outline: none;
  }

  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #162032;
    border-bottom: 1px solid var(--border);
  }

  .records-header h2 {
    margin: 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    color: var(--accent);
  }

  .record-count {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--input-bg);
    padding: 2px 6px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .record-actions {
    display: flex;
    gap: 6px;
    padding: 6px 10px;
    background: #121a2d;
    border-bottom: 1px solid var(--border);
  }

  .btn-img {
    flex: 1;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 5px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
  }

  .record-list {
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }

  .empty-records {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 10px 0;
  }

  .record-item {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .rec-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .rec-name {
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--text);
  }

  .rec-time {
    font-size: 0.65rem;
    color: var(--muted);
  }

  .rec-mid {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    padding-top: 2px;
    border-top: 1px dashed var(--border);
  }

  .rec-breakdown {
    font-size: 0.68rem;
    color: var(--muted);
  }

  .rec-stats {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rec-qty {
    color: var(--accent);
    font-weight: 700;
    font-size: 0.7rem;
  }

  .rec-amt {
    color: var(--red-amount);
    font-weight: 800;
    font-size: 0.78rem;
  }

  .rec-pay-diff {
    font-size: 0.7rem;
    color: var(--muted);
    display: flex;
    gap: 10px;
    font-weight: 600;
  }

  .footer-note {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="container" id="calc-container">
  <div class="top-bar">
    <h1>RPLMC CALC</h1>
    <div class="btn-group">
      <button id="lock-btn" class="btn-lock" onclick="toggleLock()">🔒 Locked</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>RPLMC</th>
        <th>QTY</th>
        <th>Multiplier</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody id="calc-body">
      <tr>
        <td><span class="code-badge">R</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-0">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">P</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-1">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">L</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-2">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">M</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-3">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">C</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-4">0</td>
      </tr>
    </tbody>
  </table>

  <!-- ENTER BUTTON -->
  <div class="action-bar">
    <button class="btn-enter" onclick="handleEnter()">Enter</button>
  </div>

  <!-- SUMMARY SECTION -->
  <div class="summary-section" id="summary-section">
    <div class="summary-row">
      <span class="summary-label">Total Amount</span>
      <span class="summary-value" id="total-amount-disp">0</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Payment</span>
      <input type="number" inputmode="decimal" id="payment-input" class="payment-input" placeholder="0" oninput="updatePaymentLive()">
    </div>
    <div class="summary-row">
      <span class="summary-label">Difference (Sukli)</span>
      <span class="summary-value" id="diff-disp">0</span>
    </div>
  </div>

  <!-- NAME BAR -->
  <div class="name-bar">
    <label for="entry-name">Name:</label>
    <input type="text" id="entry-name" placeholder="Enter name (optional)..." oninput="updateLiveRecord()">
  </div>
</div>

<!-- RECORD LIST CONTAINER -->
<div class="container" id="printable-records-container">
  <div class="records-header">
    <h2>Daily Records</h2>
    <span class="record-count" id="record-count">0 / 10</span>
  </div>
  <div class="record-actions" id="record-action-btns">
    <button class="btn-img" onclick="exportRecordsAsImage()">📸 Save/Share Image</button>
  </div>
  <div class="record-list" id="record-list">
    <div class="empty-records">No records yet today.</div>
  </div>
</div>

<div class="footer-note" id="status-note">Multipliers locked by default. Records auto-reset at 12:00 AM midnight.</div>

<script>
  const qtyInputs = document.querySelectorAll('.qty-input');
  const multInputs = document.querySelectorAll('.mult-input');
  const lockBtn = document.getElementById('lock-btn');
  const statusNote = document.getElementById('status-note');
  const nameInput = document.getElementById('entry-name');
  const paymentInput = document.getElementById('payment-input');
  const summarySection = document.getElementById('summary-section');
  const recordListEl = document.getElementById('record-list');
  const recordCountEl = document.getElementById('record-count');

  const MAX_RECORDS = 10;
  const LABELS = ['R', 'P', 'L', 'M', 'C'];
  let isLocked = true;
  let activeRecordId = null;

  function formatAmount(num) {
    return Math.round(num).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function formatQty(num) {
    return num.toLocaleString('en-US', { maximumFractionDigits: 4 });
  }

  function getTodayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  }

  function getFormattedTimestamp() {
    return new Date().toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
  }

  function checkMidnightReset() {
    const savedDate = localStorage.getItem('rplmc_records_date');
    const today = getTodayKey();
    if (savedDate !== today) {
      localStorage.setItem('rplmc_records', JSON.stringify([]));
      localStorage.setItem('rplmc_records_date', today);
    }
  }

  function getRecords() {
    checkMidnightReset();
    return JSON.parse(localStorage.getItem('rplmc_records') || '[]');
  }

  function saveRecords(records) {
    localStorage.setItem('rplmc_records', JSON.stringify(records));
    localStorage.setItem('rplmc_records_date', getTodayKey());
    renderRecords();
  }

  function toggleLock() {
    isLocked = !isLocked;
    multInputs.forEach(input => input.disabled = isLocked);

    if (isLocked) {
      lockBtn.innerHTML = '🔒 Locked';
      lockBtn.classList.remove('unlocked');
      statusNote.textContent = 'Multipliers locked & saved.';
    } else {
      lockBtn.innerHTML = '🔓 Unlocked';
      lockBtn.classList.add('unlocked');
      statusNote.textContent = 'Editing mode: Update multipliers, then tap to lock.';
      multInputs[0].focus();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedMults = JSON.parse(localStorage.getItem('rplmc_multipliers') || '[]');
    multInputs.forEach((input, index) => {
      if (savedMults[index] !== undefined && savedMults[index] !== '') {
        input.value = savedMults[index];
      }
    });

    checkMidnightReset();
    calculate();
    renderRecords();

    // Auto-scroll to top when any input gets focus so keyboard doesn't block it
    const allInputs = document.querySelectorAll('input');
    allInputs.forEach(input => {
      input.addEventListener('focus', () => {
        setTimeout(() => {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 150);
      });
    });

    setInterval(() => {
      const savedDate = localStorage.getItem('rplmc_records_date');
      if (savedDate && savedDate !== getTodayKey()) {
        checkMidnightReset();
        renderRecords();
      }
    }, 30000);
  });

  function calculate() {
    let totalAmount = 0;
    const currentMults = [];

    for (let i = 0; i < 5; i++) {
      const qty = parseFloat(qtyInputs[i].value) || 0;
      const mult = parseFloat(multInputs[i].value) || 0;
      const amount = qty * mult;

      document.getElementById(`amt-${i}`).textContent = formatAmount(amount);
      totalAmount += amount;
      currentMults.push(multInputs[i].value);
    }

    localStorage.setItem('rplmc_multipliers', JSON.stringify(currentMults));

    if (summarySection.classList.contains('visible')) {
      const roundedTotal = Math.round(totalAmount);
      document.getElementById('total-amount-disp').textContent = formatAmount(roundedTotal);
      updatePaymentLive();
      updateLiveRecord();
    }

    return Math.round(totalAmount);
  }

  function updatePaymentLive() {
    const totalAmount = calculateCurrentSum();
    const payment = parseFloat(paymentInput.value) || 0;
    const diff = payment - totalAmount;

    const diffDisp = document.getElementById('diff-disp');
    diffDisp.textContent = formatAmount(diff);

    if (payment === 0 && totalAmount === 0) {
      diffDisp.style.color = 'var(--text)';
    } else if (diff > 0) {
      diffDisp.style.color = '#4ade80';
    } else if (diff < 0) {
      diffDisp.style.color = '#f87171';
    } else {
      diffDisp.style.color = 'var(--text)';
    }
    updateLiveRecord();
  }

  function calculateCurrentSum() {
    let sum = 0;
    for (let i = 0; i < 5; i++) {
      const q = parseFloat(qtyInputs[i].value) || 0;
      const m = parseFloat(multInputs[i].value) || 0;
      sum += (q * m);
    }
    return Math.round(sum);
  }

  function updateLiveRecord() {
    if (!activeRecordId) return;

    let totalQty = 0;
    let totalAmount = 0;
    const breakdownParts = [];

    for (let i = 0; i < 5; i++) {
      const q = parseFloat(qtyInputs[i].value) || 0;
      const m = parseFloat(multInputs[i].value) || 0;
      totalQty += q;
      totalAmount += (q * m);
      if (q > 0) {
        breakdownParts.push(`${LABELS[i]}:${formatQty(q)}`);
      }
    }

    const roundedTotal = Math.round(totalAmount);
    const payment = parseFloat(paymentInput.value) || 0;
    const diff = payment - roundedTotal;
    const rawName = nameInput.value.trim();
    const recordName = rawName !== '' ? rawName : 'N/A';
    const breakdownStr = breakdownParts.length > 0 ? breakdownParts.join(' | ') : 'No QTY';

    const records = getRecords();
    const index = records.findIndex(r => r.id === activeRecordId);
    if (index !== -1) {
      records[index].name = recordName;
      records[index].totalQty = totalQty;
      records[index].totalAmount = roundedTotal;
      records[index].payment = payment;
      records[index].diff = diff;
      records[index].breakdown = breakdownStr;
      saveRecords(records);
    }
  }

  function handleEnter() {
    let totalQty = 0;
    let totalAmount = 0;
    const breakdownParts = [];

    for (let i = 0; i < 5; i++) {
      const q = parseFloat(qtyInputs[i].value) || 0;
      const m = parseFloat(multInputs[i].value) || 0;
      totalQty += q;
      totalAmount += (q * m);
      if (q > 0) {
        breakdownParts.push(`${LABELS[i]}:${formatQty(q)}`);
      }
    }

    const roundedTotal = Math.round(totalAmount);
    const payment = parseFloat(paymentInput.value) || 0;
    const diff = payment - roundedTotal;

    const rawName = nameInput.value.trim();
    const recordName = rawName !== '' ? rawName : 'N/A';
    const breakdownStr = breakdownParts.length > 0 ? breakdownParts.join(' | ') : 'No QTY';

    const records = getRecords();

    if (activeRecordId) {
      updateLiveRecord();
      return;
    }

    if (records.length >= MAX_RECORDS) {
      records.pop(); 
    }

    activeRecordId = Date.now();
    const newRecord = {
      id: activeRecordId,
      name: recordName,
      timestamp: getFormattedTimestamp(),
      totalQty: totalQty,
      totalAmount: roundedTotal,
      payment: payment,
      diff: diff,
      breakdown: breakdownStr
    };

    records.unshift(newRecord);
    saveRecords(records);

    summarySection.classList.add('visible');
    document.getElementById('total-amount-disp').textContent = formatAmount(roundedTotal);
    updatePaymentLive();
  }

  function exportRecordsAsImage() {
    const actionBtn = document.getElementById('record-action-btns');
    actionBtn.style.display = 'none';

    const targetElement = document.getElementById('printable-records-container');

    html2canvas(targetElement, {
      backgroundColor: '#1e293b',
      scale: 2
    }).then(canvas => {
      actionBtn.style.display = 'flex';
      const link = document.createElement('a');
      link.download = `RPLMC-Records-${getTodayKey()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err => {
      actionBtn.style.display = 'flex';
      alert('May nangyaring error sa paggawa ng image. Subukang muli.');
      console.error(err);
    });
  }

  function renderRecords() {
    const records = getRecords();
    recordCountEl.textContent = `${records.length} / ${MAX_RECORDS}`;

    if (records.length === 0) {
      recordListEl.innerHTML = '<div class="empty-records">No records yet today.</div>';
      return;
    }

    recordListEl.innerHTML = records.map((rec, idx) => `
      <div class="record-item" ${rec.id === activeRecordId ? 'style="border-color: var(--accent);"' : ''}>
        <div class="rec-top">
          <div>
            <span class="rec-name">#${records.length - idx} — ${escapeHtml(rec.name)}</span>
            <div class="rec-time">${rec.timestamp}</div>
          </div>
        </div>
        <div class="rec-mid">
          <div class="rec-breakdown">${rec.breakdown}</div>
          <div class="rec-stats">
            <span class="rec-qty">QTY: ${formatQty(rec.totalQty)}</span>
            <span class="rec-amt">${formatAmount(rec.totalAmount)}</span>
          </div>
        </div>
        <div class="rec-pay-diff">
          <span>Payment: ${formatAmount(rec.payment || 0)}</span>
          <span>Sukli/Diff: ${formatAmount(rec.diff || 0)}</span>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function clearAll() {
    qtyInputs.forEach(input => input.value = '');
    nameInput.value = '';
    paymentInput.value = '';
    activeRecordId = null;
    summarySection.classList.remove('visible');
    calculate();
    qtyInputs[0].focus();
  }
</script>

</body>
