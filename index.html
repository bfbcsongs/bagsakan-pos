<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RPLMC Calculator</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.12);
    --input-bg: #0f172a;
    --locked-bg: #162032;
    --red-amount: #f87171;
    --green-btn: #22c55e;
    --amber-btn: #f59e0b;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 16px;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    gap: 16px;
  }

  .container {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }

  .top-bar h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .mode-indicator {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    display: none;
  }

  .mode-indicator.editing {
    display: inline-block;
    background: rgba(245, 158, 11, 0.15);
    color: var(--amber-btn);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  button {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  button:active {
    transform: scale(0.97);
  }

  .btn-lock {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .btn-lock.unlocked {
    background: rgba(250, 204, 21, 0.15);
    color: #facc15;
    border: 1px solid rgba(250, 204, 21, 0.4);
  }

  .btn-clear {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* Row 1: Header */
  thead th {
    background: #162032;
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--border);
  }

  /* Column Widths */
  th:nth-child(1), td:nth-child(1) { width: 18%; text-align: center; }
  th:nth-child(2), td:nth-child(2) { width: 25%; text-align: center; }
  th:nth-child(3), td:nth-child(3) { width: 27%; text-align: center; }
  th:nth-child(4), td:nth-child(4) { width: 30%; text-align: right; padding-right: 12px; }

  /* Rows 2-6: Data Rows */
  tbody td {
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .code-badge {
    display: inline-block;
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 6px 12px;
    border-radius: 8px;
  }

  input[type="number"] {
    width: 92%;
    padding: 10px 6px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: all 0.2s;
  }

  input[type="number"]:focus {
    border-color: var(--accent);
  }

  .mult-input:disabled {
    background: var(--locked-bg);
    border-color: transparent;
    color: #94a3b8;
    cursor: not-allowed;
    opacity: 0.95;
  }

  .mult-input:not(:disabled) {
    border-color: rgba(250, 204, 21, 0.5);
    background: #172033;
    color: #fef08a;
  }

  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }

  .amount-cell {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--red-amount);
    word-break: break-all;
  }

  /* Action Bar (Enter or Save Edits) */
  .action-bar {
    padding: 12px 16px;
    background: #162032;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  .btn-action {
    flex: 1;
    padding: 12px;
    background: var(--green-btn);
    color: #052e16;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
  }

  .btn-action.editing {
    background: var(--amber-btn);
    color: #451a03;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
  }

  .btn-cancel-edit {
    display: none;
    padding: 12px 16px;
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .btn-cancel-edit.visible {
    display: inline-flex;
  }

  /* Summary Section: Total, Payment, Difference (Revealed on Enter) */
  .summary-section {
    display: none;
    background: #0b1324;
    border-bottom: 1px solid var(--border);
  }

  .summary-section.visible {
    display: block;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px dashed var(--border);
  }

  .summary-row:last-child {
    border-bottom: none;
  }

  .summary-label {
    font-size: 0.82rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }

  .summary-value {
    font-size: 1.15rem;
    font-weight: 800;
  }

  #total-qty-disp {
    color: var(--accent);
  }

  #total-amount-disp {
    color: var(--red-amount);
    font-size: 1.25rem;
  }

  .payment-input {
    width: 140px;
    padding: 8px 10px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #4ade80;
    font-size: 1.15rem;
    font-weight: 700;
    text-align: right;
    outline: none;
    transition: border-color 0.2s;
  }

  .payment-input:focus {
    border-color: var(--accent);
  }

  #diff-disp {
    font-size: 1.2rem;
  }

  /* Name Bar */
  .name-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #162032;
  }

  .name-bar label {
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .name-bar input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }

  .name-bar input[type="text"]:focus {
    border-color: var(--accent);
  }

  /* Records Section */
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #162032;
    border-bottom: 1px solid var(--border);
  }

  .records-header h2 {
    margin: 0;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .record-count {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--input-bg);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .record-list {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 420px;
    overflow-y: auto;
  }

  .empty-records {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 20px 0;
  }

  .record-item {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .record-item:hover {
    border-color: var(--accent);
    background: #162032;
  }

  .rec-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .rec-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
  }

  .rec-time {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .rec-mid {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    padding-top: 4px;
    border-top: 1px dashed var(--border);
  }

  .rec-breakdown {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .rec-stats {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rec-qty {
    color: var(--accent);
    font-weight: 700;
    font-size: 0.8rem;
  }

  .rec-amt {
    color: var(--red-amount);
    font-weight: 800;
    font-size: 0.9rem;
  }

  .rec-pay-diff {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }

  .btn-del-rec {
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.25);
    padding: 4px 8px;
    font-size: 0.72rem;
    border-radius: 6px;
  }

  .footer-note {
    font-size: 0.74rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1>RPLMC CALC <span id="mode-badge" class="mode-indicator">Editing Record</span></h1>
    <div class="btn-group">
      <button id="lock-btn" class="btn-lock" onclick="toggleLock()">🔒 Locked</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <table>
    <!-- ROW 1: HEADER -->
    <thead>
      <tr>
        <th>RPLMC</th>
        <th>QTY</th>
        <th>Multiplier</th>
        <th>Amount</th>
      </tr>
    </thead>

    <!-- ROWS 2 to 6: R, P, L, M, C -->
    <tbody id="calc-body">
      <tr>
        <td><span class="code-badge">R</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" data-row="0" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" data-row="0" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-0">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">P</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" data-row="1" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" data-row="1" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-1">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">L</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" data-row="2" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" data-row="2" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-2">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">M</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" data-row="3" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" data-row="3" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-3">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">C</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" data-row="4" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" data-row="4" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-4">0</td>
      </tr>
    </tbody>
  </table>

  <!-- ACTION BAR (Enter or Save Edits) -->
  <div class="action-bar">
    <button id="action-btn" class="btn-action" onclick="handleAction()">Enter</button>
    <button id="cancel-edit-btn" class="btn-cancel-edit" onclick="cancelEditing()">Cancel</button>
  </div>

  <!-- SUMMARY SECTION: Total, Payment, Difference (Revealed on Enter) -->
  <div class="summary-section" id="summary-section">
    <div class="summary-row">
      <span class="summary-label">Total Amount</span>
      <span class="summary-value" id="total-amount-disp">0</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Total QTY: <span id="total-qty-disp" style="color:var(--accent);">0</span></span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="summary-label" style="font-size:0.75rem;">Payment:</span>
        <input type="number" inputmode="decimal" id="payment-input" class="payment-input" placeholder="0" oninput="updatePayment()">
      </div>
    </div>
    <div class="summary-row">
      <span class="summary-label">Difference (Change / Bal)</span>
      <span class="summary-value" id="diff-disp">0</span>
    </div>
  </div>

  <!-- NAME BAR -->
  <div class="name-bar">
    <label for="entry-name">Name:</label>
    <input type="text" id="entry-name" placeholder="Enter name (optional)...">
  </div>
</div>

<!-- RECORD LIST CONTAINER -->
<div class="container">
  <div class="records-header">
    <h2>Daily Records</h2>
    <span class="record-count" id="record-count">0 / 10</span>
  </div>
  <div class="record-list" id="record-list">
    <div class="empty-records">No records yet today. Tap a record below to view/edit.</div>
  </div>
</div>

<div class="footer-note" id="status-note">Multipliers locked by default. Records auto-reset at 12:00 AM midnight.</div>

<script>
  const qtyInputs = document.querySelectorAll('.qty-input');
  const multInputs = document.querySelectorAll('.mult-input');
  const lockBtn = document.getElementById('lock-btn');
  const statusNote = document.getElementById('status-note');
  const nameInput = document.getElementById('entry-name');
  const paymentInput = document.getElementById('payment-input');
  const actionBtn = document.getElementById('action-btn');
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  const modeBadge = document.getElementById('mode-badge');
  const summarySection = document.getElementById('summary-section');
  const recordListEl = document.getElementById('record-list');
  const recordCountEl = document.getElementById('record-count');

  const MAX_RECORDS = 10;
  const LABELS = ['R', 'P', 'L', 'M', 'C'];
  let isLocked = true;
  let editingRecordId = null;

  function formatAmount(num) {
    return Math.round(num).toLocaleString('en-US', {
      maximumFractionDigits: 0
    });
  }

  function formatQty(num) {
    return num.toLocaleString('en-US', {
      maximumFractionDigits: 4
    });
  }

  function getTodayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  }

  function getFormattedTimestamp() {
    return new Date().toLocaleString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    });
  }

  function checkMidnightReset() {
    const savedDate = localStorage.getItem('rplmc_records_date');
    const today = getTodayKey();
    if (savedDate !== today) {
      localStorage.setItem('rplmc_records', JSON.stringify([]));
      localStorage.setItem('rplmc_records_date', today);
    }
  }

  function getRecords() {
    checkMidnightReset();
    return JSON.parse(localStorage.getItem('rplmc_records') || '[]');
  }

  function saveRecords(records) {
    localStorage.setItem('rplmc_records', JSON.stringify(records));
    localStorage.setItem('rplmc_records_date', getTodayKey());
    renderRecords();
  }

  function toggleLock() {
    isLocked = !isLocked;
    multInputs.forEach(input => input.disabled = isLocked);

    if (isLocked) {
      lockBtn.innerHTML = '🔒 Locked';
      lockBtn.classList.remove('unlocked');
      statusNote.textContent = 'Multipliers locked & saved.';
    } else {
      lockBtn.innerHTML = '🔓 Unlocked';
      lockBtn.classList.add('unlocked');
      statusNote.textContent = 'Editing mode: Update multipliers, then tap to lock.';
      multInputs[0].focus();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedMults = JSON.parse(localStorage.getItem('rplmc_multipliers') || '[]');
    multInputs.forEach((input, index) => {
      if (savedMults[index] !== undefined && savedMults[index] !== '') {
        input.value = savedMults[index];
      }
    });

    checkMidnightReset();
    calculateRows();
    renderRecords();

    setInterval(() => {
      const savedDate = localStorage.getItem('rplmc_records_date');
      if (savedDate && savedDate !== getTodayKey()) {
        checkMidnightReset();
        renderRecords();
      }
    }, 30000);
  });

  // Calculate individual row amounts & save multipliers as you type
  function calculateRows() {
    const currentMults = [];
    for (let i = 0; i < 5; i++) {
      const qty = parseFloat(qtyInputs[i].value) || 0;
      const mult = parseFloat(multInputs[i].value) || 0;
      const amount = qty * mult;

      document.getElementById(`amt-${i}`).textContent = formatAmount(amount);
      currentMults.push(multInputs[i].value);
    }
    localStorage.setItem('rplmc_multipliers', JSON.stringify(currentMults));
  }

  // Compute totals for current inputs
  function computeTotals() {
    let totalQty = 0;
    let totalAmount = 0;

    for (let i = 0; i < 5; i++) {
      const qty = parseFloat(qtyInputs[i].value) || 0;
      const mult = parseFloat(multInputs[i].value) || 0;
      totalQty += qty;
      totalAmount += (qty * mult);
    }

    const roundedTotal = Math.round(totalAmount);
    const payment = parseFloat(paymentInput.value) || 0;
    const diff = payment - roundedTotal;

    return { totalQty, totalAmount: roundedTotal, payment, diff };
  }

  // Update payment and difference dynamically when payment input changes
  function updatePayment() {
    calculateRows();
    const { totalQty, totalAmount, payment, diff } = computeTotals();

    document.getElementById('total-qty-disp').textContent = formatQty(totalQty);
    document.getElementById('total-amount-disp').textContent = formatAmount(totalAmount);

    const diffDisp = document.getElementById('diff-disp');
    diffDisp.textContent = formatAmount(diff);
    if (diff > 0) {
      diffDisp.style.color = '#4ade80';
    } else if (diff < 0) {
      diffDisp.style.color = '#f87171';
    } else {
      diffDisp.style.color = 'var(--text)';
    }
  }

  // Handle Enter (New) or Save Changes (Edit existing)
  function handleAction() {
    calculateRows();
    const { totalQty, totalAmount, payment, diff } = computeTotals();
    const rawName = nameInput.value.trim();
    const recordName = rawName !== '' ? rawName : 'N/A';

    const breakdownParts = [];
    for (let i = 0; i < 5; i++) {
      const q = parseFloat(qtyInputs[i].value) || 0;
      if (q > 0) {
        breakdownParts.push(`${LABELS[i]}:${formatQty(q)}`);
      }
    }

    const breakdownStr = breakdownParts.length > 0 ? breakdownParts.join(' | ') : 'No QTY';
    const records = getRecords();
    const qtyValuesArray = Array.from(qtyInputs).map(inp => inp.value);

    if (editingRecordId !== null) {
      // UPDATE EXISTING RECORD
      const index = records.findIndex(r => r.id === editingRecordId);
      if (index !== -1) {
        records[index].name = recordName;
        records[index].totalQty = totalQty;
        records[index].totalAmount = totalAmount;
        records[index].payment = payment;
        records[index].diff = diff;
        records[index].breakdown = breakdownStr;
        records[index].qtys = qtyValuesArray;
      }
      saveRecords(records);
      cancelEditing();
    } else {
      // ADD NEW RECORD
      if (records.length >= MAX_RECORDS) {
        alert('Record list is full (10/10). Please delete some entries from the list below to make space.');
        return;
      }

      const newRecord = {
        id: Date.now(),
        name: recordName,
        timestamp: getFormattedTimestamp(),
        totalQty: totalQty,
        totalAmount: totalAmount,
        payment: payment,
        diff: diff,
        breakdown: breakdownStr,
        qtys: qtyValuesArray
      };

      records.unshift(newRecord);
      saveRecords(records);

      // SHOW TOTAL SECTION & RESET CALCULATOR FOR NEXT ENTRY
      summarySection.classList.add('visible');
      document.getElementById('total-qty-disp').textContent = formatQty(totalQty);
      document.getElementById('total-amount-disp').textContent = formatAmount(totalAmount);
      updatePayment();

      // Clear inputs for next transaction while keeping summary visible
      qtyInputs.forEach(input => input.value = '');
      nameInput.value = '';
      paymentInput.value = '';
      calculateRows();
      qtyInputs[0].focus();
    }
  }

  // Load record into calculator for editing
  function loadRecordForEdit(id) {
    const records = getRecords();
    const rec = records.find(r => r.id === id);
    if (!rec) return;

    editingRecordId = rec.id;

    if (rec.qtys && Array.isArray(rec.qtys)) {
      qtyInputs.forEach((input, idx) => {
        input.value = rec.qtys[idx] !== undefined ? rec.qtys[idx] : '';
      });
    } else {
      qtyInputs.forEach(input => input.value = '');
    }

    nameInput.value = rec.name !== 'N/A' ? rec.name : '';
    paymentInput.value = rec.payment !== undefined ? rec.payment : '';

    calculateRows();
    summarySection.classList.add('visible');
    updatePayment();

    actionBtn.textContent = 'Save Changes';
    actionBtn.classList.add('editing');
    cancelEditBtn.classList.add('visible');
    modeBadge.classList.add('editing');

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEditing() {
    editingRecordId = null;
    actionBtn.textContent = 'Enter';
    actionBtn.classList.remove('editing');
    cancelEditBtn.classList.remove('visible');
    modeBadge.classList.remove('editing');
    clearAll();
  }

  function deleteRecord(event, id) {
    event.stopPropagation();
    if (editingRecordId === id) {
      cancelEditing();
    }
    const records = getRecords().filter(item => item.id !== id);
    saveRecords(records);
  }

  function renderRecords() {
    const records = getRecords();
    recordCountEl.textContent = `${records.length} / ${MAX_RECORDS}`;

    if (records.length === 0) {
      recordListEl.innerHTML = '<div class="empty-records">No records yet today. Tap a record below to view/edit.</div>';
      return;
    }

    recordListEl.innerHTML = records.map((rec, idx) => `
      <div class="record-item" onclick="loadRecordForEdit(${rec.id})">
        <div class="rec-top">
          <div>
            <span class="rec-name">#${records.length - idx} — ${escapeHtml(rec.name)}</span>
            <div class="rec-time">${rec.timestamp}</div>
          </div>
          <button class="btn-del-rec" onclick="deleteRecord(event, ${rec.id})">Delete</button>
        </div>
        <div class="rec-mid">
          <div class="rec-breakdown">${rec.breakdown}</div>
          <div class="rec-stats">
            <span class="rec-qty">QTY: ${formatQty(rec.totalQty)}</span>
            <span class="rec-amt">${formatAmount(rec.totalAmount)}</span>
          </div>
        </div>
        <div class="rec-pay-diff">
          <span>Pay: ${formatAmount(rec.payment || 0)}</span>
          <span>Diff: ${formatAmount(rec.diff || 0)}</span>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function clearAll() {
    qtyInputs.forEach(input => input.value = '');
    nameInput.value = '';
    paymentInput.value = '';
    summarySection.classList.remove('visible');
    calculateRows();
    qtyInputs[0].focus();
  }
</script>

</body>
</html>
