<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RPLMC Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.12);
    --input-bg: #0f172a;
    --locked-bg: #162032;
    --red-amount: #f87171;
    --green-btn: #22c55e;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 4px;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    gap: 8px;
  }

  .container {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  .top-bar h1 {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
  }

  .btn-group {
    display: flex;
    gap: 4px;
  }

  button {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn-lock {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .btn-lock.unlocked {
    background: rgba(250, 204, 21, 0.15);
    color: #facc15;
    border: 1px solid rgba(250, 204, 21, 0.4);
  }

  .btn-clear {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead th {
    background: #162032;
    color: var(--muted);
    font-size: 0.68rem;
    text-transform: uppercase;
    padding: 6px 2px;
    border-bottom: 1px solid var(--border);
  }

  th:nth-child(1), td:nth-child(1) { width: 16%; text-align: center; }
  th:nth-child(2), td:nth-child(2) { width: 26%; text-align: center; }
  th:nth-child(3), td:nth-child(3) { width: 28%; text-align: center; }
  th:nth-child(4), td:nth-child(4) { width: 30%; text-align: right; padding-right: 8px; }

  tbody td {
    padding: 4px 2px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .code-badge {
    display: inline-block;
    font-weight: 800;
    font-size: 0.85rem;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 3px 8px;
    border-radius: 4px;
  }

  input[type="number"] {
    width: 95%;
    padding: 5px 2px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    outline: none;
  }

  input[type="number"]:focus {
    border-color: var(--accent);
  }

  .mult-input:disabled {
    background: var(--locked-bg);
    border-color: transparent;
    color: #94a3b8;
  }

  .mult-input:not(:disabled) {
    border-color: rgba(250, 204, 21, 0.5);
    background: #172033;
    color: #fef08a;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .amount-cell {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--red-amount);
  }

  .action-bar {
    padding: 6px 10px;
    background: #162032;
    border-bottom: 1px solid var(--border);
  }

  .btn-enter {
    width: 100%;
    padding: 6px;
    background: var(--green-btn);
    color: #052e16;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
  }

  .summary-section {
    display: none;
    background: #0b1324;
    border-bottom: 1px solid var(--border);
  }

  .summary-section.visible {
    display: block;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px dashed var(--border);
  }

  .summary-row:last-child {
    border-bottom: none;
  }

  .summary-label {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--muted);
  }

  .summary-value {
    font-size: 0.95rem;
    font-weight: 800;
  }

  #total-amount-disp {
    color: var(--red-amount);
    font-size: 1.05rem;
  }

  .payment-input {
    width: 120px;
    padding: 4px 6px;
    background: var(--input-bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: #4ade80;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: right;
    outline: none;
  }

  #diff-disp {
    font-size: 1rem;
  }

  .name-bar-wrapper {
    position: relative;
    background: #162032;
  }

  .name-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
  }

  .name-bar label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .name-bar input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 5px 8px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 600;
    outline: none;
  }

  .name-bar input[type="text"]:focus {
    border-color: var(--accent);
  }

  .btn-recent {
    background: rgba(56, 189, 248, 0.14);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .recent-dropdown {
    display: none;
    position: absolute;
    left: 10px;
    right: 10px;
    top: 100%;
    z-index: 30;
    background: #0b1324;
    border: 1px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.65);
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
  }

  .recent-dropdown.open {
    display: block;
  }

  .recent-header {
    font-size: 0.64rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--muted);
    padding: 3px 8px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 2px;
  }

  .recent-item {
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 5px;
    color: var(--text);
    text-align: left;
    padding: 6px 8px;
    font-size: 0.8rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .recent-item:hover,
  .recent-item:active {
    background: var(--accent-bg);
    color: var(--accent);
  }

  .recent-rank {
    font-size: 0.66rem;
    color: var(--muted);
    margin-left: 8px;
  }

  .recent-empty {
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
    padding: 8px;
  }

  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #162032;
    border-bottom: 1px solid var(--border);
  }

  .records-header h2 {
    margin: 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    color: var(--accent);
  }

  .record-count {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--input-bg);
    padding: 2px 6px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .record-actions {
    display: flex;
    gap: 6px;
    padding: 6px 10px;
    background: #121a2d;
    border-bottom: 1px solid var(--border);
  }

  .btn-img {
    flex: 1;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 5px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
  }

  .today-section {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: #131c2e;
  }

  .today-title {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    color: #4ade80;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .folders-section {
    padding: 6px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .folder-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #121a2d;
    overflow: hidden;
  }

  .folder-btn {
    width: 100%;
    background: #162032;
    color: var(--text);
    border: none;
    border-radius: 0;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    font-weight: 800;
    text-align: left;
  }

  .folder-btn.current-day {
    color: var(--accent);
  }

  .folder-meta {
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 700;
  }

  .folder-body {
    display: none;
    padding: 6px 8px;
    flex-direction: column;
    gap: 6px;
    background: #0d1526;
    border-top: 1px solid var(--border);
  }

  .folder-body.open {
    display: flex;
  }

  .empty-records {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 8px 0;
  }

  .record-item {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .record-item.active-rec {
    border-color: var(--accent);
  }

  .rec-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .rec-name {
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--text);
  }

  .rec-time {
    font-size: 0.65rem;
    color: var(--muted);
  }

  .rec-mid {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    padding-top: 2px;
    border-top: 1px dashed var(--border);
  }

  .rec-breakdown {
    font-size: 0.68rem;
    color: var(--muted);
  }

  .rec-stats {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rec-qty {
    color: var(--accent);
    font-weight: 700;
    font-size: 0.7rem;
  }

  .rec-amt {
    color: var(--red-amount);
    font-weight: 800;
    font-size: 0.78rem;
  }

  .rec-pay-diff {
    font-size: 0.7rem;
    color: var(--muted);
    display: flex;
    gap: 10px;
    font-weight: 600;
  }

  .footer-note {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="container" id="calc-container">
  <div class="top-bar">
    <h1>RPLMC CALC</h1>
    <div class="btn-group">
      <button id="lock-btn" class="btn-lock" onclick="toggleLock()">🔒 Locked</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>RPLMC</th>
        <th>QTY</th>
        <th>Multiplier</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody id="calc-body">
      <tr>
        <td><span class="code-badge">R</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-0">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">P</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-1">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">L</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-2">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">M</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-3">0</td>
      </tr>
      <tr>
        <td><span class="code-badge">C</span></td>
        <td><input type="number" inputmode="decimal" class="qty-input" placeholder="0" oninput="calculate()"></td>
        <td><input type="number" inputmode="decimal" class="mult-input" placeholder="0" oninput="calculate()" disabled></td>
        <td class="amount-cell" id="amt-4">0</td>
      </tr>
    </tbody>
  </table>

  <div class="action-bar">
    <button class="btn-enter" onclick="handleEnter()">Enter</button>
  </div>

  <div class="summary-section" id="summary-section">
    <div class="summary-row">
      <span class="summary-label">Total Amount</span>
      <span class="summary-value" id="total-amount-disp">0</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Payment</span>
      <input type="number" inputmode="decimal" id="payment-input" class="payment-input" placeholder="0" oninput="updatePaymentLive()">
    </div>
    <div class="summary-row">
      <span class="summary-label">Difference (Sukli)</span>
      <span class="summary-value" id="diff-disp">0</span>
    </div>
  </div>

  <div class="name-bar-wrapper" id="name-bar-wrapper">
    <div class="name-bar">
      <label for="entry-name">Name:</label>
      <input type="text" id="entry-name" placeholder="Enter name (optional)..." oninput="handleNameInput()">
      <button type="button" class="btn-recent" id="recent-btn" onclick="toggleRecentDropdown(event)">Recent ▾</button>
    </div>
    <div class="recent-dropdown" id="recent-dropdown"></div>
  </div>
</div>

<div class="container" id="printable-records-container">
  <div class="records-header">
    <h2>Daily Records</h2>
    <span class="record-count" id="record-count">0 / 10 Days</span>
  </div>
  <div class="record-actions" id="record-action-btns">
    <button class="btn-img" onclick="exportRecordsAsImage()">📸 Save/Share Image</button>
  </div>

  <div class="today-section">
    <div class="today-title">
      <span>Current Date: <strong id="current-date-label">----</strong></span>
      <span id="today-entries-count">0 entries</span>
    </div>
    <div id="today-record-list">
      <div class="empty-records">No records yet today.</div>
    </div>
  </div>

  <div class="folders-section" id="folders-list">
    <div class="empty-records">No date folders yet.</div>
  </div>
</div>

<div class="footer-note" id="status-note">Auto-resets at 12:00 AM daily. Tap any date folder to open/close records (up to 10 days FIFO).</div>

<script>
  const qtyInputs = document.querySelectorAll('.qty-input');
  const multInputs = document.querySelectorAll('.mult-input');
  const lockBtn = document.getElementById('lock-btn');
  const statusNote = document.getElementById('status-note');
  const nameInput = document.getElementById('entry-name');
  const recentDropdown = document.getElementById('recent-dropdown');
  const paymentInput = document.getElementById('payment-input');
  const summarySection = document.getElementById('summary-section');
  const todayRecordListEl = document.getElementById('today-record-list');
  const todayEntriesCountEl = document.getElementById('today-entries-count');
  const currentDateLabelEl = document.getElementById('current-date-label');
  const foldersListEl = document.getElementById('folders-list');
  const recordCountEl = document.getElementById('record-count');

  const MAX_DAYS_HISTORY = 10;
  const MAX_RECENT_NAMES = 15;
  const RECENT_NAMES_KEY = 'rplmc_recent_names';
  const LABELS = ['R', 'P', 'L', 'M', 'C'];
  let isLocked = true;
  let activeRecordId = null;
  let activeRecordDate = null;
  let currentTrackedDate = getTodayKey();
  let openFolders = new Set();

  function formatAmount(num) {
    return Math.round(num).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function formatQty(num) {
    return num.toLocaleString('en-US', { maximumFractionDigits: 4 });
  }

  function getTodayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  }

  function getFormattedTimestamp() {
    return new Date().toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
  }

  function getRecentNames() {
    try {
      const list = JSON.parse(localStorage.getItem(RECENT_NAMES_KEY) || '[]');
      return Array.isArray(list) ? list.slice(0, MAX_RECENT_NAMES) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecentName(rawName) {
    const cleaned = (rawName || '').trim();
    if (!cleaned || cleaned.toUpperCase() === 'N/A') return;

    const existing = getRecentNames();
    const filtered = existing.filter(item => item.toLowerCase() !== cleaned.toLowerCase());
    const updated = [cleaned, ...filtered].slice(0, MAX_RECENT_NAMES);
    localStorage.setItem(RECENT_NAMES_KEY, JSON.stringify(updated));
    renderRecentDropdown();
  }

  function selectRecentName(selectedName) {
    nameInput.value = selectedName;
    closeRecentDropdown();
    updateLiveRecord();
    saveRecentName(selectedName);
  }

  function toggleRecentDropdown(event) {
    event.stopPropagation();
    const isOpen = recentDropdown.classList.contains('open');
    if (isOpen) {
      closeRecentDropdown();
    } else {
      renderRecentDropdown();
      recentDropdown.classList.add('open');
    }
  }

  function closeRecentDropdown() {
    recentDropdown.classList.remove('open');
  }

  function renderRecentDropdown() {
    const allRecent = getRecentNames();
    const query = nameInput.value.trim().toLowerCase();
    const matches = query
      ? allRecent.filter(n => n.toLowerCase().includes(query))
      : allRecent;

    if (matches.length === 0) {
      recentDropdown.innerHTML = `<div class="recent-empty">${query ? 'No matching recent name.' : 'No recent names yet.'}</div>`;
      return;
    }

    const headerHtml = `<div class="recent-header">Recent Names (${matches.length}/${allRecent.length} max ${MAX_RECENT_NAMES})</div>`;
    const itemsHtml = matches.map((name, idx) => {
      const escapedAttr = escapeHtml(name).replace(/"/g, '&quot;');
      return `
        <button type="button" class="recent-item" onclick="selectRecentName(decodeRecentAttr(this.dataset.name))" data-name="${escapedAttr}">
          <span>${escapeHtml(name)}</span>
          <span class="recent-rank">#${idx + 1}</span>
        </button>
      `;
    }).join('');

    recentDropdown.innerHTML = headerHtml + itemsHtml;
  }

  function decodeRecentAttr(val) {
    const txt = document.createElement('textarea');
    txt.innerHTML = val || '';
    return txt.value;
  }

  function handleNameInput() {
    updateLiveRecord();
    if (recentDropdown.classList.contains('open')) {
      renderRecentDropdown();
    }
  }

  document.addEventListener('click', (e) => {
    const wrapper = document.getElementById('name-bar-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      closeRecentDropdown();
    }
  });

  function getAllDaysHistory() {
    try {
      return JSON.parse(localStorage.getItem('rplmc_history_days') || '{}');
    } catch (e) {
      return {};
    }
  }

  function saveAllDaysHistory(historyObj) {
    const today = getTodayKey();

    Object.keys(historyObj).forEach(key => {
      if (key !== today && (!Array.isArray(historyObj[key]) || historyObj[key].length === 0)) {
        delete historyObj[key];
      } else if (!Array.isArray(historyObj[key])) {
        historyObj[key] = [];
      }
    });

    if (!historyObj[today]) {
      historyObj[today] = [];
    }

    const keys = Object.keys(historyObj).sort();
    if (keys.length > MAX_DAYS_HISTORY) {
      const excessCount = keys.length - MAX_DAYS_HISTORY;
      for (let i = 0; i < excessCount; i++) {
        delete historyObj[keys[i]];
      }
    }

    localStorage.setItem('rplmc_history_days', JSON.stringify(historyObj));
    renderRecords();
  }

  function ensureTodayFolderExists() {
    const historyObj = getAllDaysHistory();
    const today = getTodayKey();
    if (!Array.isArray(historyObj[today])) {
      historyObj[today] = [];
      saveAllDaysHistory(historyObj);
    }
  }

  function checkMidnightRollover() {
    const nowDate = getTodayKey();
    if (nowDate !== currentTrackedDate) {
      currentTrackedDate = nowDate;
      activeRecordId = null;
      activeRecordDate = null;
      qtyInputs.forEach(input => input.value = '');
      nameInput.value = '';
      paymentInput.value = '';
      summarySection.classList.remove('visible');
      ensureTodayFolderExists();
      calculate();
      renderRecords();
    } else {
      ensureTodayFolderExists();
    }
  }

  function getRecordsForDate(dateKey) {
    const historyObj = getAllDaysHistory();
    return historyObj[dateKey] || [];
  }

  function saveRecordsForDate(dateKey, dayRecords) {
    const historyObj = getAllDaysHistory();
    historyObj[dateKey] = dayRecords;
    saveAllDaysHistory(historyObj);
  }

  function toggleFolder(dateKey) {
    if (openFolders.has(dateKey)) {
      openFolders.delete(dateKey);
    } else {
      openFolders.add(dateKey);
    }
    renderRecords();
  }

  function toggleLock() {
    isLocked = !isLocked;
    multInputs.forEach(input => input.disabled = isLocked);

    if (isLocked) {
      lockBtn.innerHTML = '🔒 Locked';
      lockBtn.classList.remove('unlocked');
      statusNote.textContent = 'Multipliers locked & saved.';
    } else {
      lockBtn.innerHTML = '🔓 Unlocked';
      lockBtn.classList.add('unlocked');
      statusNote.textContent = 'Editing mode: Update multipliers, then tap to lock.';
      multInputs[0].focus();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedMults = JSON.parse(localStorage.getItem('rplmc_multipliers') || '[]');
    multInputs.forEach((input, index) => {
      if (savedMults[index] !== undefined && savedMults[index] !== '') {
        input.value = savedMults[index];
      }
    });

    ensureTodayFolderExists();
    renderRecentDropdown();
    calculate();
    renderRecords();

    const allInputs = document.querySelectorAll('input');
    allInputs.forEach(input => {
      input.addEventListener('focus', () => {
        setTimeout(() => {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 150);
      });
    });

    nameInput.addEventListener('blur', () => {
      if (nameInput.value.trim()) {
        saveRecentName(nameInput.value);
      }
    });

    setInterval(() => {
      checkMidnightRollover();
      renderRecords();
    }, 15000);
  });

  function calculate() {
    let totalAmount = 0;
    const currentMults = [];

    for (let i = 0; i < 5; i++) {
      const qty = parseFloat(qtyInputs[i].value) || 0;
      const mult = parseFloat(multInputs[i].value) || 0;
      const amount = qty * mult;

      document.getElementById(`amt-${i}`).textContent = formatAmount(amount);
      totalAmount += amount;
      currentMults.push(multInputs[i].value);
    }

    localStorage.setItem('rplmc_multipliers', JSON.stringify(currentMults));

    const roundedTotal = Math.round(totalAmount);
    if (summarySection.classList.contains('visible')) {
      document.getElementById('total-amount-disp').textContent = formatAmount(roundedTotal);
      updatePaymentLive();
      updateLiveRecord();
    }

    return roundedTotal;
  }

  function updatePaymentLive() {
    const totalAmount = calculateCurrentSum();
    const payment = parseFloat(paymentInput.value) || 0;
    const diff = payment - totalAmount;

    const diffDisp = document.getElementById('diff-disp');
    diffDisp.textContent = formatAmount(diff);

    if (payment === 0 && totalAmount === 0) {
      diffDisp.style.color = 'var(--text)';
    } else if (diff > 0) {
      diffDisp.style.color = '#4ade80';
    } else if (diff < 0) {
      diffDisp.style.color = '#f87171';
    } else {
      diffDisp.style.color = 'var(--text)';
    }

    updateLiveRecord();
  }

  function calculateCurrentSum() {
    let sum = 0;
    for (let i = 0; i < 5; i++) {
      const q = parseFloat(qtyInputs[i].value) || 0;
      const m = parseFloat(multInputs[i].value) || 0;
      sum += (q * m);
    }
    return Math.round(sum);
  }

  function buildEntryPayload() {
    let totalQty = 0;
    let totalAmount = 0;
    const breakdownParts = [];

    for (let i = 0; i < 5; i++) {
      const q = parseFloat(qtyInputs[i].value) || 0;
      const m = parseFloat(multInputs[i].value) || 0;
      totalQty += q;
      totalAmount += (q * m);
      if (q > 0) {
        breakdownParts.push(`${LABELS[i]}:${formatQty(q)}`);
      }
    }

    const roundedTotal = Math.round(totalAmount);
    const payment = parseFloat(paymentInput.value) || 0;
    const diff = payment - roundedTotal;
    const rawName = nameInput.value.trim();
    const recordName = rawName !== '' ? rawName : 'N/A';
    const breakdownStr = breakdownParts.length > 0 ? breakdownParts.join(' | ') : 'No QTY';

    return {
      name: recordName,
      totalQty,
      totalAmount: roundedTotal,
      payment,
      diff,
      breakdown: breakdownStr
    };
  }

  function updateLiveRecord() {
    if (!activeRecordId || !activeRecordDate) return;
    if (activeRecordDate !== getTodayKey()) {
      checkMidnightRollover();
      return;
    }

    const payload = buildEntryPayload();
    const records = getRecordsForDate(activeRecordDate);
    const index = records.findIndex(r => r.id === activeRecordId);

    if (index !== -1) {
      records[index] = { ...records[index], ...payload };
      saveRecordsForDate(activeRecordDate, records);
    }
  }

  function handleEnter() {
    checkMidnightRollover();
    const today = getTodayKey();
    const payload = buildEntryPayload();
    const records = getRecordsForDate(today);

    if (nameInput.value.trim()) {
      saveRecentName(nameInput.value);
    }

    summarySection.classList.add('visible');
    document.getElementById('total-amount-disp').textContent = formatAmount(payload.totalAmount);
    updatePaymentLive();

    if (activeRecordId && activeRecordDate === today) {
      updateLiveRecord();
      renderRecords();
      return;
    }

    activeRecordId = Date.now();
    activeRecordDate = today;

    const newRecord = {
      id: activeRecordId,
      timestamp: getFormattedTimestamp(),
      ...payload
    };

    records.unshift(newRecord);
    saveRecordsForDate(today, records);
  }

  function exportRecordsAsImage() {
    const actionBtn = document.getElementById('record-action-btns');
    const folderBodies = document.querySelectorAll('.folder-body');

    actionBtn.style.display = 'none';

    const previousOpenStates = [];
    folderBodies.forEach((body, idx) => {
      previousOpenStates[idx] = body.classList.contains('open');
      body.classList.add('open');
    });

    const targetElement = document.getElementById('printable-records-container');

    html2canvas(targetElement, {
      backgroundColor: '#1e293b',
      scale: 2,
      windowWidth: targetElement.scrollWidth,
      windowHeight: targetElement.scrollHeight
    }).then(canvas => {
      actionBtn.style.display = 'flex';
      folderBodies.forEach((body, idx) => {
        if (!previousOpenStates[idx]) {
          body.classList.remove('open');
        }
      });

      const link = document.createElement('a');
      link.download = `RPLMC-Records-${getTodayKey()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err => {
      actionBtn.style.display = 'flex';
      folderBodies.forEach((body, idx) => {
        if (!previousOpenStates[idx]) {
          body.classList.remove('open');
        }
      });
      alert('May nangyaring error sa paggawa ng image. Subukang muli.');
      console.error(err);
    });
  }

  function renderRecordCardsHtml(dayRecords) {
    return dayRecords.map((rec, idx) => {
      const activeClass = rec.id === activeRecordId ? ' active-rec' : '';
      return `
        <div class="record-item${activeClass}">
          <div class="rec-top">
            <div>
              <span class="rec-name">#${dayRecords.length - idx} — ${escapeHtml(rec.name)}</span>
              <div class="rec-time">${rec.timestamp}</div>
            </div>
          </div>
          <div class="rec-mid">
            <div class="rec-breakdown">${escapeHtml(rec.breakdown)}</div>
            <div class="rec-stats">
              <span class="rec-qty">QTY: ${formatQty(rec.totalQty)}</span>
              <span class="rec-amt">${formatAmount(rec.totalAmount)}</span>
            </div>
          </div>
          <div class="rec-pay-diff">
            <span>Payment: ${formatAmount(rec.payment || 0)}</span>
            <span>Sukli/Diff: ${formatAmount(rec.diff || 0)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderRecords() {
    const today = getTodayKey();
    currentDateLabelEl.textContent = today;

    const historyObj = getAllDaysHistory();
    const todayRecords = Array.isArray(historyObj[today]) ? historyObj[today] : [];
    todayEntriesCountEl.textContent = `${todayRecords.length} ${todayRecords.length === 1 ? 'entry' : 'entries'}`;

    if (todayRecords.length === 0) {
      todayRecordListEl.innerHTML = '<div class="empty-records">No records yet today.</div>';
    } else {
      todayRecordListEl.innerHTML = renderRecordCardsHtml(todayRecords);
    }

    const folderKeys = Object.keys(historyObj)
      .filter(k => k === today || (Array.isArray(historyObj[k]) && historyObj[k].length > 0))
      .sort()
      .reverse();

    recordCountEl.textContent = `${folderKeys.length} / ${MAX_DAYS_HISTORY} Days`;

    if (folderKeys.length === 0) {
      foldersListEl.innerHTML = '<div class="empty-records">No date folders yet.</div>';
      return;
    }

    foldersListEl.innerHTML = folderKeys.map(dateKey => {
      const items = Array.isArray(historyObj[dateKey]) ? historyObj[dateKey] : [];
      const isCurrent = dateKey === today;
      const isOpen = openFolders.has(dateKey);
      const dayTotal = items.reduce((sum, r) => sum + (Number(r.totalAmount) || 0), 0);

      return `
        <div class="folder-card">
          <button type="button" class="folder-btn${isCurrent ? ' current-day' : ''}" onclick="toggleFolder('${dateKey}')">
            <span>${isOpen ? '📂' : '📁'} ${dateKey}${isCurrent ? ' (Today)' : ''}</span>
            <span class="folder-meta">${items.length} rec · ₱${formatAmount(dayTotal)}</span>
          </button>
          <div class="folder-body${isOpen ? ' open' : ''}">
            ${items.length > 0 ? renderRecordCardsHtml(items) : '<div class="empty-records">Folder is empty.</div>'}
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function clearAll() {
    if (nameInput.value.trim()) {
      saveRecentName(nameInput.value);
    }
    qtyInputs.forEach(input => input.value = '');
    nameInput.value = '';
    paymentInput.value = '';
    closeRecentDropdown();
    activeRecordId = null;
    activeRecordDate = null;
    summarySection.classList.remove('visible');
    calculate();
    renderRecords();
    qtyInputs[0].focus();
  }
</script>
